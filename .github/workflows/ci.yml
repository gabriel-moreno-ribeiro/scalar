name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: VirtusLab/scala-cli-setup@v1
      - run: scala-cli test --server=false .
      - name: demo scene
        run: |
          scala-cli run --server=false . -- demo demo.png
          scala-cli run --server=false . -- marker 42 marker42.png
          scala-cli run --server=false . -- detect marker42.png detected.png
      - uses: actions/upload-artifact@v4
        with:
          name: demo
          path: |
            demo.png
            detected.png
